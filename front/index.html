<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca Universitária</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>


    
  <!-- Mensagens de sucesso e erro -->
  <div id="mensagens" class="mensagens" aria-live="polite"></div>

  <header class="topo">
    <div class="container py-4">
      <h1 class="h3 mb-1">Biblioteca Universitária</h1>
      <p class="mb-0 topo-sub">Acervo de livros e revistas</p>
    </div>
  </header>

  <main class="container py-4">

    <section aria-labelledby="titulo-resumo" class="mb-5">
      <h2 id="titulo-resumo" class="h5 mb-3">Resumo do acervo</h2>
      <div class="row g-3">
        <div class="col-12 col-sm-4">
          <div class="resumo-item">
            <span class="resumo-numero" id="resumoTotal">–</span>
            <span class="resumo-rotulo">materiais no total</span>
          </div>
        </div>
        <div class="col-6 col-sm-4">
          <div class="resumo-item resumo-livro">
            <span class="resumo-numero" id="resumoLivros">–</span>
            <span class="resumo-rotulo">livros (14 dias)</span>
          </div>
        </div>
        <div class="col-6 col-sm-4">
          <div class="resumo-item resumo-revista">
            <span class="resumo-numero" id="resumoRevistas">–</span>
            <span class="resumo-rotulo">revistas (7 dias)</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Listagem -->
    <section aria-labelledby="titulo-lista" class="mb-5">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <h2 id="titulo-lista" class="h5 mb-0">Materiais cadastrados</h2>
        <div class="d-flex flex-wrap gap-2">
          <div class="btn-group" role="group" aria-label="Filtrar por tipo">
            <button type="button" class="btn btn-outline-secondary btn-sm active" data-filtro="todos" aria-pressed="true">Todos</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-filtro="livro" aria-pressed="false">Livros</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-filtro="revista" aria-pressed="false">Revistas</button>
          </div>
          <button type="button" class="btn btn-outline-primary btn-sm" id="btnRecarregar">Atualizar lista</button>
        </div>
      </div>

      <div id="estadoLista" class="estado-lista" role="status"></div>
      <div id="lista" class="row g-3"></div>
    </section>

    <!-- Cadastro -->
    <section aria-labelledby="titulo-cadastro" class="mb-5">
      <h2 id="titulo-cadastro" class="h5 mb-3">Cadastrar novo material</h2>

      <ul class="nav nav-tabs" id="abasCadastro" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="aba-livro" data-bs-toggle="tab" data-bs-target="#painel-livro" type="button" role="tab" aria-controls="painel-livro" aria-selected="true">Livro</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="aba-revista" data-bs-toggle="tab" data-bs-target="#painel-revista" type="button" role="tab" aria-controls="painel-revista" aria-selected="false">Revista</button>
        </li>
      </ul>



      <div class="tab-content painel-form">
        <!-- Formulário do livro -->
        <div class="tab-pane fade show active" id="painel-livro" role="tabpanel" aria-labelledby="aba-livro" tabindex="0">
          <form id="formLivro" novalidate>
            <div class="row g-3">
              <div class="col-12 col-md-8">
                <label for="livro-titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="livro-titulo" name="titulo" autocomplete="off">
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-12 col-md-4">
                <label for="livro-ano" class="form-label">Ano de publicação</label>
                <input type="number" class="form-control" id="livro-ano" name="anoPublicacao" inputmode="numeric">
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-12 col-md-8">
                <label for="livro-autor" class="form-label">Autor</label>
                <input type="text" class="form-control" id="livro-autor" name="autor" autocomplete="off">
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-12 col-md-4">
                <label for="livro-paginas" class="form-label">Número de páginas</label>
                <input type="number" class="form-control" id="livro-paginas" name="paginas" inputmode="numeric">
                <div class="invalid-feedback"></div>
              </div>
            </div>
            <button type="submit" class="btn btn-primary mt-4">Cadastrar livro</button>
          </form>
        </div>

        <!-- Formulário de revista -->
        <div class="tab-pane fade" id="painel-revista" role="tabpanel" aria-labelledby="aba-revista" tabindex="0">
          <form id="formRevista" novalidate>
            <div class="row g-3">
              <div class="col-12 col-md-8">
                <label for="revista-titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="revista-titulo" name="titulo" autocomplete="off">
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-12 col-md-4">
                <label for="revista-ano" class="form-label">Ano de publicação</label>
                <input type="number" class="form-control" id="revista-ano" name="anoPublicacao" inputmode="numeric">
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-12 col-md-4">
                <label for="revista-edicao" class="form-label">Número da edição</label>
                <input type="number" class="form-control" id="revista-edicao" name="edicao" inputmode="numeric">
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-12 col-md-4">
                <label for="revista-mes" class="form-label">Mês de publicação</label>
                <select class="form-select" id="revista-mes" name="mesPublicacao"></select>
                <div class="invalid-feedback"></div>
              </div>
            </div>
            <button type="submit" class="btn btn-primary mt-4">Cadastrar revista</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <div class="container py-3">Desenvolvimento Web e Mobile I · Trabalho final</div>
  </footer>

  <!--detalhes-->
  <div class="modal fade" id="modalInfo" tabindex="-1" aria-labelledby="modalInfoTitulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="modalInfoTitulo"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body" id="modalInfoCorpo"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- editar -->
  <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarTitulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <form id="formEditar" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="modalEditarTitulo">Editar material</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-12">
                <label for="ed-titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="ed-titulo" name="titulo" autocomplete="off">
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-12 col-sm-6">
                <label for="ed-ano" class="form-label">Ano de publicação</label>
                <input type="number" class="form-control" id="ed-ano" name="anoPublicacao" inputmode="numeric">
                <div class="invalid-feedback"></div>
              </div>

              <!-- Campos de livro -->
              <div class="col-12 col-sm-6 campos-livro">
                <label for="ed-paginas" class="form-label">Número de páginas</label>
                <input type="number" class="form-control" id="ed-paginas" name="paginas" inputmode="numeric">
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-12 campos-livro">
                <label for="ed-autor" class="form-label">Autor</label>
                <input type="text" class="form-control" id="ed-autor" name="autor" autocomplete="off">
                <div class="invalid-feedback"></div>
              </div>

              <!-- Campos de revista -->
              <div class="col-12 col-sm-6 campos-revista">
                <label for="ed-edicao" class="form-label">Número da edição</label>
                <input type="number" class="form-control" id="ed-edicao" name="edicao" inputmode="numeric">
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-12 col-sm-6 campos-revista">
                <label for="ed-mes" class="form-label">Mês de publicação</label>
                <select class="form-select" id="ed-mes" name="mesPublicacao"></select>
                <div class="invalid-feedback"></div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar alterações</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!--confirmando exclusão -->
  <div class="modal fade" id="modalExcluir" tabindex="-1" aria-labelledby="modalExcluirTitulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="modalExcluirTitulo">Excluir material</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <p class="mb-0" id="textoExcluir"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btnConfirmarExcluir">Excluir</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
